name: ABR-17 Submission Coordinator
on:
  pull_request:
    paths:
      - 'bridge/orchestration/submission-coordinator.mjs'
      - 'bridge/orchestration/managed-*.mjs'
      - 'bridge/orchestration/local-execution-coordinator.mjs'
      - 'bridge/orchestration/job-admission-coordinator.mjs'
      - 'bridge/orchestration/mcp-milestone-integration.mjs'
      - 'bridge/server/agent-bridge-runtime.mjs'
      - 'jobs/admission/**'
      - 'linear-agent-bridge/run_agent.py'
      - 'linear-agent-bridge/test_run_agent.py'
      - 'scripts/test-submission-m4.mjs'
      - 'scripts/test-submission-m5.mjs'
      - 'scripts/recover-managed-submission.mjs'
      - 'scripts/submission-host-readiness.py'
      - 'jobs/persistence/submission-exclusive-lease.mjs'
      - 'scripts/fixtures/submission-provider-fixture.mjs'
      - '.agents/skills/**/SKILL.md'
      - 'bridge/orchestration/submission-publication.mjs'
      - 'integrations/submission-linear-worker.mjs'
      - 'scripts/test-submission-m3.mjs'
      - 'bridge/orchestration/submission-ingress.mjs'
      - 'bridge/orchestration/submission-git-preflight.mjs'
      - 'bridge/handlers/submission-channel.mjs'
      - 'integrations/submission-github-broker.mjs'
      - 'scripts/submit-work.mjs'
      - 'scripts/test-submission-m2.mjs'
      - 'jobs/persistence/submission-outbox.mjs'
      - 'scripts/test-submission-coordinator.mjs'
      - 'package.json'
      - '.github/workflows/submission-coordinator.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/orchestration/submission-coordinator.mjs'
      - 'bridge/orchestration/managed-*.mjs'
      - 'bridge/orchestration/local-execution-coordinator.mjs'
      - 'bridge/orchestration/job-admission-coordinator.mjs'
      - 'bridge/orchestration/mcp-milestone-integration.mjs'
      - 'bridge/server/agent-bridge-runtime.mjs'
      - 'jobs/admission/**'
      - 'linear-agent-bridge/run_agent.py'
      - 'linear-agent-bridge/test_run_agent.py'
      - 'scripts/test-submission-m4.mjs'
      - 'scripts/test-submission-m5.mjs'
      - 'scripts/recover-managed-submission.mjs'
      - 'scripts/submission-host-readiness.py'
      - 'jobs/persistence/submission-exclusive-lease.mjs'
      - 'scripts/fixtures/submission-provider-fixture.mjs'
      - '.agents/skills/**/SKILL.md'
      - 'bridge/orchestration/submission-publication.mjs'
      - 'integrations/submission-linear-worker.mjs'
      - 'scripts/test-submission-m3.mjs'
      - 'bridge/orchestration/submission-ingress.mjs'
      - 'bridge/orchestration/submission-git-preflight.mjs'
      - 'bridge/handlers/submission-channel.mjs'
      - 'integrations/submission-github-broker.mjs'
      - 'scripts/submit-work.mjs'
      - 'scripts/test-submission-m2.mjs'
      - 'jobs/persistence/submission-outbox.mjs'
      - 'scripts/test-submission-coordinator.mjs'
      - 'package.json'
      - '.github/workflows/submission-coordinator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run submission:test
      - run: npm run submission:m3:test
      - run: npm run submission:m4:test
      - name: AGY managed wrapper unit tests
        run: |
          python3 -m venv /tmp/abr17-python
          /tmp/abr17-python/bin/pip install -r linear-agent-bridge/requirements.txt
          cd linear-agent-bridge
          PYTHONDONTWRITEBYTECODE=1 /tmp/abr17-python/bin/python -m unittest test_run_agent.py
      - name: Install disposable Bubblewrap
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
      - name: Private command and real isolated Git preflight
        run: sudo "$(command -v node)" --test scripts/test-submission-m2.mjs scripts/test-submission-m5.mjs
      - run: npm run bridge:test
      - run: npm run test:reliability
      - name: Prepare isolated local Worker configuration
        run: |
          echo 'DOMAIN=example.com' > .env
          for agent in ANTIGRAVITY CHATGPT CHATGPT_CLI GEMINI GEMMA TRAE MOCK; do
            echo "${agent}_KV_NAMESPACE_ID=00000000000000000000000000000000" >> .env
          done
      - run: npm run types
      - run: npm run typecheck
