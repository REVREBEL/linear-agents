name: Agent Context Blueprint Validation

on:
  pull_request:
    paths:
      - '.agents/README.md'
      - 'agents/README.md'
      - 'bridge/README.md'
      - '.agents/context.yaml'
      - 'AGENTS.md'
      - 'agents/README.md'
      - 'bridge/README.md'
      - 'jobs/README.md'
      - 'docs/blueprints/agent-context/**'
      - 'templates/context/**'
      - 'agents/agent-registry-schema.json'
      - 'agents/agent-registry.yaml'
      - 'agents/profiles/candidates/**'
      - 'agents/registry.json'
      - 'agents/registry.schema.json'
      - 'scripts/validate-context-blueprint.py'
      - 'scripts/test_agent_context_bootstrap.py'
      - 'scripts/test_context_readme_frontmatter.py'
      - 'scripts/test_context_profile_version.py'
      - 'scripts/reconcile-agent-runtimes.py'
      - 'scripts/review-research-promotion.py'
      - 'scripts/test_review_research_promotion.py'
      - 'scripts/test_reconcile_agent_runtimes.py'
      - '.github/workflows/agent-context-blueprint.yml'
  workflow_dispatch:

jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Validate research profile structure
        run: node --test agents/profiles/profile-structure.test.mjs
      - name: Install pinned schema validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Validate context and profile templates
        run: python scripts/validate-context-blueprint.py
      - name: Test project-local context bootstrap
        run: python scripts/test_agent_context_bootstrap.py
      - name: Test owning README context metadata
        run: python scripts/test_context_readme_frontmatter.py
      - name: Test research profile-version migration gate
        run: python scripts/test_context_profile_version.py
      - name: Validate disabled-only host runtime inventory source
        run: python scripts/reconcile-agent-runtimes.py --validate
      - name: Test staged host inventory reconciliation
        run: python scripts/test_reconcile_agent_runtimes.py
      - name: Test reviewed research-profile promotion
        run: python scripts/test_review_research_promotion.py
