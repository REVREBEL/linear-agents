name: Agent Context Blueprint Validation

on:
  pull_request:
    paths:
      - '.agents/README.md'
      - 'agents/README.md'
      - 'bridge/README.md'
      - '.agents/context.yaml'
      - 'memory/**/README.md'
      - 'memory/README.md'
      - 'integrations/**/README.md'
      - 'integrations/README.md'
      - 'AGENTS.md'
      - 'agents/README.md'
      - 'bridge/README.md'
      - 'jobs/README.md'
      - 'docs/blueprints/agent-context/**'
      - 'templates/context/**'
      - 'agents/agent-registry-schema.json'
      - 'agents/agent-registry.yaml'
      - 'agents/profiles/candidates/**'
      - 'agents/registry.json'
      - 'agents/registry.schema.json'
      - 'scripts/validate-context-blueprint.py'
      - 'scripts/context_contract.py'
      - 'scripts/agent_context_cli.py'
      - 'scripts/context_resolver.py'
      - 'scripts/test_context_resolver.py'
      - 'scripts/test_context_safety.py'
      - 'scripts/install-agent-context.py'
      - 'scripts/test_agent_context_cli.py'
      - 'scripts/test_install_agent_context.py'
      - 'scripts/validate-context-contract.py'
      - 'scripts/test_context_contract.py'
      - 'scripts/reconcile-host-root-readmes.py'
      - 'scripts/publish-context-templates.py'
      - 'scripts/test_publish_context_templates.py'
      - 'scripts/test_reconcile_host_root_readmes.py'
      - 'scripts/test_agent_context_bootstrap.py'
      - 'scripts/test_context_readme_frontmatter.py'
      - 'scripts/test_context_domain_ownership.py'
      - 'scripts/test_context_profile_version.py'
      - 'scripts/reconcile-agent-runtimes.py'
      - 'scripts/review-research-promotion.py'
      - 'scripts/test_review_research_promotion.py'
      - 'scripts/test_reconcile_agent_runtimes.py'
      - '.github/workflows/agent-context-blueprint.yml'
  workflow_dispatch:

jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Validate research profile structure
        run: node --test agents/profiles/profile-structure.test.mjs
      - name: Install pinned schema validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Validate context and profile templates
        run: python scripts/validate-context-blueprint.py
      - name: Validate Context v1 alias and frontmatter contracts
        run: python scripts/validate-context-contract.py
      - name: Test Context v1 metadata and cross-platform aliases
        run: python scripts/test_context_contract.py
      - name: Verify portable Agent Context CLI
        run: python scripts/test_agent_context_cli.py
      - name: Test recursive README context selection and explanation
        run: python scripts/test_context_resolver.py
      - name: Test filesystem boundaries and explicit partial context
        run: python scripts/test_context_safety.py
      - name: Validate reviewed Agent Context CLI artifact
        run: python scripts/install-agent-context.py --validate
      - name: Test guarded Agent Context CLI installation
        run: python scripts/test_install_agent_context.py
      - name: Test project-local context bootstrap
        run: python scripts/test_agent_context_bootstrap.py
      - name: Test owning README context metadata
        run: python scripts/test_context_readme_frontmatter.py
      - name: Test memory and integration ownership contexts
        run: python scripts/test_context_domain_ownership.py
      - name: Validate Git-owned Ubuntu host README sources
        run: python scripts/reconcile-host-root-readmes.py --validate
      - name: Test controlled Ubuntu README reconciliation
        run: python scripts/test_reconcile_host_root_readmes.py
      - name: Validate tracked and versioned context templates
        run: python scripts/publish-context-templates.py --validate
      - name: Test idempotent context template publication
        run: python scripts/test_publish_context_templates.py
      - name: Test research profile-version migration gate
        run: python scripts/test_context_profile_version.py
      - name: Validate disabled-only host runtime inventory source
        run: python scripts/reconcile-agent-runtimes.py --validate
      - name: Test staged host inventory reconciliation
        run: python scripts/test_reconcile_agent_runtimes.py
      - name: Test reviewed research-profile promotion
        run: python scripts/test_review_research_promotion.py
