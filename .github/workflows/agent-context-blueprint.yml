name: Agent Context Blueprint Validation

on:
  pull_request:
    paths:
      - 'docs/blueprints/agent-context/**'
      - 'templates/context/**'
      - 'agents/agent-registry-schema.json'
      - 'agents/agent-registry.yaml'
      - 'agents/profiles/candidates/**'
      - 'agents/registry.json'
      - 'agents/registry.schema.json'
      - 'scripts/validate-context-blueprint.py'
      - '.github/workflows/agent-context-blueprint.yml'
  workflow_dispatch:

jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Validate context and profile templates
        run: python scripts/validate-context-blueprint.py
