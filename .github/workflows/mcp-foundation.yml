name: ABR-94 Remote MCP Local Foundation

on:
  pull_request:
    paths:
      - 'bridge/agent/mcp-host-agent/**'
      - 'bridge/server/mcp-relay/**'
      - 'docs/audits/mcp/**'
      - 'scripts/test-mcp-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mcp-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/agent/mcp-host-agent/**'
      - 'bridge/server/mcp-relay/**'
      - 'docs/audits/mcp/**'
      - 'scripts/test-mcp-*.mjs'
      - '.github/workflows/mcp-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-and-loopback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install reviewed root dependencies
        run: npm ci
      - name: Verify provenance, parity matrix, paired localhost MCP and negative security tests
        run: npm run mcp:foundation:test
      - name: Preserve existing bridge test contract
        run: npm run bridge:test
