# Context v1 metadata declaration. ABR-73 provides CLI validation; C3 adds retrieval.
# Paths under the "repo" root are relative to this project's root (the .agents/ parent).
# Host roots are optional; existence and source retrieval belong to C3-C5.
contextVersion: 1
project: agent-bridge
roots:
  repo:
    path: .
    required: true
  host-agents:
    environment: AGENT_CONTEXT_AGENTS_ROOT
    default: /opt/agents
    required: false
  host-agent-tools:
    environment: AGENT_CONTEXT_AGENT_TOOLS_ROOT
    default: /opt/agent-tools
    required: false
  host-global-tools:
    environment: AGENT_CONTEXT_GLOBAL_TOOLS_ROOT
    default: /opt/global-tools
    required: false
documents:
  repo.bootstrap: {root: repo, path: .agents/README.md}
  repo.agents: {root: repo, path: agents/README.md}
  repo.bridge: {root: repo, path: bridge/README.md}
  repo.jobs: {root: repo, path: jobs/README.md}
  repo.memory: {root: repo, path: memory/README.md}
  repo.memory.migrations: {root: repo, path: memory/migrations/README.md}
  repo.memory.scripts: {root: repo, path: memory/scripts/README.md}
  repo.integrations: {root: repo, path: integrations/README.md}
  repo.integrations.litellm: {root: repo, path: integrations/litellm/README.md}
  repo.integrations.openrouter: {root: repo, path: integrations/openrouter/README.md}
  host.agent-runtimes: {root: host-agents, path: README.md}
  host.agent-tools: {root: host-agent-tools, path: README.md}
  host.global-tools: {root: host-global-tools, path: README.md}
entrypoints:
  default: repo.bootstrap
  profiles: repo.agents
  deployment: repo.bridge
  memory: repo.memory
  integrations: repo.integrations
  runtime: host.agent-runtimes
