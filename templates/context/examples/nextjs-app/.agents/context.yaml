# Independent Next.js/Payload context contract (E4), not Bridge routing metadata.
contextVersion: 1
project: independent-nextjs-cms
roots:
  repo:
    path: .
    required: true
  host-ui:
    environment: INDEPENDENT_CONTEXT_UI_ROOT
    default: /opt/independent-ui-kit
    required: false
  host-tools:
    environment: INDEPENDENT_CONTEXT_TOOLS_ROOT
    default: /opt/independent-toolchain
    required: false
documents:
  repo.bootstrap: {root: repo, path: .agents/README.md}
  repo.application: {root: repo, path: src/README.md}
  repo.collections: {root: repo, path: src/collections/README.md}
  host.design-system: {root: host-ui, path: README.md, source: templates/context/host-roots/design-system/README.md}
  host.toolchain: {root: host-tools, path: README.md, source: templates/context/host-roots/toolchain/README.md}
entrypoints:
  default: repo.bootstrap
  application: repo.application
  collections: repo.collections
